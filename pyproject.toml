[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-screening-bot"
version = "1.0.0"
description = "Telegram HR screening workflow implemented in Python"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "aiogram>=3.22,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "pypdf>=6,<7",
  "PyYAML>=6.0,<7",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
hr-screening-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.vacancies" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
